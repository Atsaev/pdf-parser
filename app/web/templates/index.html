{% extends "base.html" %}

{% block content %}
<header class="head">
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
      <path d="M14 3v5h5"/>
      <path d="M9 14l2 2 4-4"/>
    </svg>
  </span>
  <div>
    <h1>Фильтр этикеток Ozon</h1>
    <p class="sub">В ticket останутся только страницы, чьи номера отправления есть в листе сборки.</p>
  </div>
</header>

<form
  class="card form"
  hx-post="/filter"
  hx-target="#result"
  hx-swap="innerHTML"
  hx-encoding="multipart/form-data"
  hx-indicator="#busy"
>
  <label class="dropzone" data-dropzone data-empty="Перетащите PDF или нажмите">
    <input type="file" name="assembly" accept="application/pdf" required>
    <span class="dz-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6l4 4v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
        <path d="M9 3v4h6"/>
      </svg>
    </span>
    <span class="dz-body">
      <strong>Лист сборки</strong>
      <span class="dz-file" data-filename>Перетащите PDF или нажмите</span>
    </span>
  </label>

  <label class="dropzone" data-dropzone data-empty="Перетащите PDF или нажмите">
    <input type="file" name="ticket" accept="application/pdf" required>
    <span class="dz-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6l4 4v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
        <path d="M9 3v4h6"/>
      </svg>
    </span>
    <span class="dz-body">
      <strong>Этикетки (ticket)</strong>
      <span class="dz-file" data-filename>Перетащите PDF или нажмите</span>
    </span>
  </label>

  <div class="actions">
    <button class="btn primary" type="submit">Отфильтровать</button>
    <span id="busy" class="htmx-indicator"><span class="spinner" aria-hidden="true"></span>Обработка…</span>
  </div>
</form>

<div id="result" aria-live="polite"></div>
{% endblock %}
