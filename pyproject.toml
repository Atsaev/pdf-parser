[project]
name = "ozon-pdf-parser"
version = "0.1.0"
description = "Фильтр этикеток Ozon по листу сборки"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pdfplumber>=0.11.10",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
ozon-filter = "app.cli:main"
ozon-filter-web = "app.web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
